name: squadlink-local

services:
  db:
    image: supabase/postgres:15.8.1.085
    container_name: squadlink-local-db
    restart: unless-stopped
    ports:
      - "${LOCAL_DB_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"
      JWT_EXP: "${JWT_EXPIRY:-3600}"
    volumes:
      - squadlink_db_data:/var/lib/postgresql/data
      - ./docker/db/init/00-local-bootstrap.sh:/docker-entrypoint-initdb.d/init-scripts/00-local-bootstrap.sh:ro
      - ./docker/db/bootstrap/00-local-bootstrap.sql:/etc/squadlink/bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: squadlink-local-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.186.0
    container_name: squadlink-local-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "${NEXT_PUBLIC_SUPABASE_URL:?Define NEXT_PUBLIC_SUPABASE_URL en .env}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/postgres"
      GOTRUE_SITE_URL: "${NEXT_PUBLIC_APP_URL:?Define NEXT_PUBLIC_APP_URL en .env}"
      GOTRUE_URI_ALLOW_LIST: "${AUTH_ADDITIONAL_REDIRECT_URLS:-http://localhost:3000,http://127.0.0.1:3000}"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "${JWT_EXPIRY:-3600}"
      GOTRUE_JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "${AUTH_AUTO_CONFIRM:-true}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL:-no-reply@squadlink.local}"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: "${SMTP_SENDER_NAME:-SquadLink Local}"
      GOTRUE_MAILER_URLPATHS_INVITE: /login
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /login
      GOTRUE_MAILER_URLPATHS_RECOVERY: /login
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /ajustes
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rest:
    image: postgrest/postgrest:v14.8
    container_name: squadlink-local-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/postgres"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "${PGRST_DB_MAX_ROWS:-1000}"
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: "${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}"
      PGRST_JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"
      PGRST_APP_SETTINGS_JWT_EXP: "${JWT_EXPIRY:-3600}"
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--version"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine
    container_name: squadlink-local-gateway
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      - "${LOCAL_SUPABASE_PORT:-54321}:80"
    volumes:
      - ./docker/nginx/supabase.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  squadlink_db_data:
